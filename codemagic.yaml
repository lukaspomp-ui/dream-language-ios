workflows:
  ios-release:
    name: Dream Language iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "Dream Language.xcworkspace"
        XCODE_SCHEME: "Dream Language"
        BUNDLE_ID: "app.lovable.dream-language"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install
      - name: Strip push and associated-domains entitlements
        script: |
          cd src
          PLIST="Dream Language/Entitlements/Entitlements.plist"
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" "$PLIST" || true
          echo "--- entitlements after strip ---"
          cat "$PLIST"
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files (generate key + create if missing)
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/ios_dist_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/ios_dist_key \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing to Xcode project
        script: |
          cd src
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
