workflows:
  ios-release:
    name: Dream Language iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "Dream Language.xcworkspace"
        XCODE_SCHEME: "Dream Language"
        BUNDLE_ID: "app.lovable.dream-language"
        APP_STORE_APPLE_ID: "6802682642"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set next TestFlight build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Cannot determine the latest TestFlight build number; refusing a duplicate upload."
            exit 1
          fi
          cd src
          agvtool new-version -all "$((LATEST_BUILD_NUMBER + 1))"
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install
      - name: Strip push and associated-domains entitlements
        script: |
          cd src
          PLIST="Dream Language/Entitlements/Entitlements.plist"
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" "$PLIST" || true
          echo "--- entitlements after strip ---"
          cat "$PLIST"
      - name: Ensure Sign in with Apple on the existing App ID
        script: |
          set -euo pipefail
          app-store-connect bundle-ids capabilities JWD9X3QRGH --json > /tmp/dream-capabilities.json
          if ! grep -q '"SIGN_IN_WITH_APPLE"' /tmp/dream-capabilities.json; then
            app-store-connect bundle-ids enable-capabilities JWD9X3QRGH --capability "Sign In with Apple"
          fi
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files (generate key + create if missing)
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/ios_dist_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/ios_dist_key \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing to Xcode project
        script: |
          cd src
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Verify Apple sign-in in the signed IPA
        script: |
          set -euo pipefail
          IPA_PATH=$(find src/build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          unzip -q "$IPA_PATH" -d /tmp/dream-verified-ipa
          APP_PATH=$(find /tmp/dream-verified-ipa/Payload -maxdepth 1 -name '*.app' -print -quit)
          codesign --display --entitlements :- "$APP_PATH" > /tmp/dream-signed-entitlements.plist
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > /tmp/dream-embedded-profile.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' /tmp/dream-signed-entitlements.plist)" = "Default"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' /tmp/dream-embedded-profile.plist)" = "Default"
          echo "Sign in with Apple verified in both the signed app and embedded profile."
    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testing; external beta review needs completed test contact details.
        submit_to_testflight: false


  ios-oauth-validation:
    name: Validate OAuth iOS compilation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install
      - name: Compile unsigned iOS simulator app
        script: |
          set -o pipefail
          cd src
          xcodebuild -workspace "Dream Language.xcworkspace" -scheme "Dream Language" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/oauth-validation.log
    artifacts:
      - /tmp/oauth-validation.log
